<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>Render Fotorealista | Studio Visual</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    /* ✅ Misma paleta azul del portafolio */
    :root{
      --primary: #050a10;
      --secondary: #0d1f33;
      --accent: #123FAE;
      --accent-light: #3D7DFF;
      --accent-soft: #80A5FF;
      --accent-glow: rgba(18, 63, 174, 0.4);
      --text: #e0e6ed;
      --text-muted: #8b95a5;
      --white: #ffffff;
    }

    body{
      font-family:'Poppins',sans-serif;
      background:#0a0e17;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .hero{
      width:100%;
      min-height: 100vh;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 5rem 9%;
      gap: 3rem;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%,
        rgba(61,125,255,.30) 0%,
        rgba(18,63,174,.22) 40%,
        rgba(5,10,16,1) 80%);
      flex-wrap: wrap;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(61,125,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61,125,255,.06) 1px, transparent 1px);
      background-size:36px 36px;
      mask-image: radial-gradient(circle at center, black 25%, transparent 85%);
      opacity:.5;
      pointer-events: none;
    }

    /* ===== CARD ===== */
    .card{
      position:relative;
      z-index:2;
      width: 100%;
      max-width: 340px;
      padding: 28px 26px;
      border-radius: 32px;
      background: rgba(13,31,51,0.75);
      backdrop-filter: blur(2px);
      border:1px solid rgba(18,63,174,.45);
      box-shadow:
        0 30px 50px -20px rgba(0,0,0,0.9),
        0 0 0 1px rgba(255,255,255,.02) inset,
        0 0 35px rgba(18,63,174,.25);
      text-align:center;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(61,125,255,.6);
    }

    .icon-wrap{
      width:70px;
      height:70px;
      margin:0 auto 16px;
      border-radius: 24px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:2px solid rgba(61,125,255,.35);
      box-shadow: 0 0 18px rgba(61,125,255,.25);
      background: linear-gradient(135deg, var(--secondary), var(--primary));
    }

    .cube{
      width:32px;
      height:32px;
      border:4px solid #fff;
      border-radius:10px;
      transform:rotate(45deg);
      position:relative;
      box-shadow: 0 0 8px rgba(61,125,255,0.6);
    }

    .cube::after{
      content:"";
      position:absolute;
      width:14px;
      height:14px;
      background:#fff;
      right:-6px;
      top:8px;
      border-radius: 2px;
      box-shadow: 0 0 5px var(--accent-light);
    }

    .card h1{
      font-size:1.8rem;
      line-height:1.2;
      margin-bottom:12px;
      font-weight:700;
      letter-spacing:-0.5px;
      background: linear-gradient(135deg, #ffffff, var(--accent-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .card p{
      color:var(--text);
      font-size:0.85rem;
      line-height:1.45;
      font-weight:400;
      margin-bottom:20px;
      opacity:0.9;
    }

    .blender{
      width:58px;
      margin-bottom:18px;
      filter:drop-shadow(0 0 12px rgba(255,170,0,.4));
      transition: filter 0.3s;
    }
    .blender:hover {
      filter:drop-shadow(0 0 18px rgba(255,170,0,.7));
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:170px;
      height:48px;
      border-radius:60px;
      text-decoration:none;
      color:#fff;
      font-weight:600;
      letter-spacing:1px;
      font-size:0.9rem;
      border:2px solid rgba(61,125,255,.5);
      background: linear-gradient(135deg, rgba(18,63,174,.25), rgba(18,63,174,.05));
      box-shadow: inset 0 0 12px rgba(61,125,255,.12), 0 0 18px rgba(61,125,255,.12);
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      cursor: pointer;
    }

    .btn:hover{
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(61,125,255,.35);
      border-color: var(--accent-light);
      background: linear-gradient(135deg, rgba(61,125,255,.3), rgba(61,125,255,.08));
    }

    /* ===== CARRUSEL ===== */
    .soda-area{
      position:relative;
      z-index:2;
      width: auto;
      flex: 1;
      min-width: 280px;
      display:flex;
      flex-direction: column;
      justify-content:center;
      align-items:center;
    }

    .carousel-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .carousel-track {
      position: relative;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .carousel-item {
      position: absolute;
      width: 100%;
      opacity: 0;
      transform: rotate(-12deg) scale(0.85) translateY(35px);
      transition: opacity 0.55s cubic-bezier(0.2, 0.9, 0.4, 1.1), 
                  transform 0.55s cubic-bezier(0.2, 0.85, 0.3, 1);
      filter: drop-shadow(0 40px 35px rgba(0,0,0,.9)) drop-shadow(0 0 25px rgba(61,125,255,.25));
      pointer-events: none;
      will-change: transform, opacity;
    }

    .carousel-item.active {
      opacity: 1;
      transform: rotate(-8deg) scale(1) translateY(0px);
      z-index: 20;
    }

    .carousel-item img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 0 auto;
      animation: floatItem 4.5s ease-in-out infinite;
      border-radius: 20px;
      transition: filter 0.3s;
    }

    @keyframes floatItem {
      0%,100% { transform: translateY(0px); }
      50%     { transform: translateY(-16px); }
    }

    .dynamic-shadow {
      position: absolute;
      bottom: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 40px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.9) 0%, rgba(0, 0, 0, 0.5) 45%, transparent 85%);
      filter: blur(14px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      transition: width 0.4s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.3s ease;
    }

    /* INDICADORES */
    .carousel-indicators {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      z-index: 25;
      background: rgba(5, 10, 16, 0.45);
      backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 60px;
      border: 1px solid rgba(18, 63, 174, 0.55);
      width: fit-content;
      margin: 0 auto;
    }

    .indicator {
      width: 12px;
      height: 12px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.4, 1);
    }

    .indicator.active {
      background: var(--accent-light);
      width: 32px;
      border-radius: 20px;
      box-shadow: 0 0 14px var(--accent-light);
    }

    .indicator:hover {
      background: var(--accent-soft);
      transform: scale(1.2);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1000px) {
      .hero {
        flex-direction: column;
        justify-content: center;
        padding: 3rem 1.5rem;
        gap: 3rem;
        min-height: auto;
      }
      .card { max-width: 380px; margin: 0 auto; }
      .soda-area { width: 100%; margin-top: 0; }
      .carousel-track { width: 380px; height: 380px; }
      .carousel-item img { max-width: 360px; }
      .dynamic-shadow { width: 280px; height: 32px; bottom: -28px; }
      .carousel-indicators { padding: 6px 20px; gap: 16px; }
    }

    @media (max-width: 680px) {
      .hero { padding: 2rem 1.2rem; gap: 2.2rem; }
      .card { padding: 22px 18px; max-width: 100%; border-radius: 28px; }
      .card h1 { font-size: 1.6rem; }
      .card p { font-size: 0.8rem; margin-bottom: 16px; }
      .icon-wrap { width: 60px; height: 60px; margin-bottom: 12px; }
      .cube { width: 28px; height: 28px; border-width: 3px; }
      .cube::after { width: 10px; height: 10px; right: -5px; top: 6px; }
      .blender { width: 48px; margin-bottom: 14px; }
      .btn { width: 150px; height: 44px; font-size: 0.8rem; }
      .carousel-track { width: 300px; height: 300px; }
      .carousel-item img { max-width: 280px; }
      .dynamic-shadow { width: 220px; height: 26px; bottom: -20px; filter: blur(12px); }
      .carousel-indicators { gap: 12px; padding: 5px 18px; }
      .indicator { width: 8px; height: 8px; }
      .indicator.active { width: 28px; }
    }

    @media (max-width: 480px) {
      .hero { padding: 1.8rem 1rem; gap: 1.8rem; }
      .card { padding: 18px 16px; }
      .card h1 { font-size: 1.45rem; }
      .carousel-track { width: 260px; height: 260px; }
      .carousel-item img { max-width: 240px; }
      .dynamic-shadow { width: 180px; height: 22px; bottom: -16px; filter: blur(10px); }
      .carousel-indicators { padding: 4px 14px; gap: 10px; }
    }
  </style>
</head>

<body>
  <section class="hero">

    <!-- CARD -->
    <div class="card">
      <div class="icon-wrap">
        <div class="cube"></div>
      </div>
      <h1>Render Fotorealista</h1>
      <p>
        Visualización en alta fidelidad para exhibir productos,
        packaging y previsualización de proyectos. Estrategia
        de branding con imágenes comerciales de impacto.
      </p>
      <img
        class="blender"
        src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Blender_logo_no_text.svg"
        alt="Blender"
      >
      <br>
      <a href="#" class="btn">COTIZAR PROYECTO</a>
    </div>

    <!-- CARRUSEL: soda + laptop + esfera + eco -->
    <div class="soda-area">
      <div class="carousel-container">
        <div class="carousel-track">
          <div class="carousel-item">
            <img src="soda.gif" alt="Lata Soda Render" loading="eager">
          </div>
          <div class="carousel-item">
            <img src="laptop.gif" alt="Laptop Render" loading="eager">
          </div>
          <div class="carousel-item">
            <img src="esfera.gif" alt="Esfera Render" loading="lazy">
          </div>
          <div class="carousel-item">
            <img src="eco.gif" alt="Eco Render" loading="lazy">
          </div>
        </div>
        <div class="dynamic-shadow" id="dynamicShadow"></div>
      </div>

      <div class="carousel-indicators"></div>
    </div>
  </section>

  <script>
    (function() {
      const items = Array.from(document.querySelectorAll('.carousel-item'));
      const indicatorsWrap = document.querySelector('.carousel-indicators');
      const shadowDiv = document.getElementById('dynamicShadow');
      const container = document.querySelector('.carousel-container');

      /* Tamaño de sombra por item: [desktop, tablet, mobile] */
      const shadowSizes = [
        [360, 240, 200],  // soda
        [390, 260, 210],  // laptop
        [320, 230, 190],  // esfera
        [340, 240, 200]   // eco
      ];

      let currentIndex = 0;
      let intervalId = null;
      let isTransitioning = false;

      /* Indicadores dinámicos */
      const indicators = items.map((_, i) => {
        const dot = document.createElement('div');
        dot.className = 'indicator';
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          goTo(i);
          resetCarouselTimer();
        });
        indicatorsWrap.appendChild(dot);
        return dot;
      });

      function updateShadowSize() {
        if (!shadowDiv) return;
        const w = window.innerWidth;
        const sizes = shadowSizes[currentIndex] || shadowSizes[0];
        shadowDiv.style.width = (w <= 680 ? sizes[2] : (w <= 1000 ? sizes[1] : sizes[0])) + 'px';
      }

      function goTo(index) {
        if (isTransitioning || index === currentIndex) return;
        isTransitioning = true;
        items.forEach((item, i) => item.classList.toggle('active', i === index));
        indicators.forEach((dot, i) => dot.classList.toggle('active', i === index));
        currentIndex = index;
        updateShadowSize();
        setTimeout(() => { isTransitioning = false; }, 550);
      }

      function nextSlide() {
        if (isTransitioning) return;
        goTo((currentIndex + 1) % items.length);
      }

      function startCarousel() {
        stopCarousel();
        intervalId = setInterval(nextSlide, 4400);
      }
      function stopCarousel() {
        if (intervalId) { clearInterval(intervalId); intervalId = null; }
      }
      function resetCarouselTimer() { stopCarousel(); startCarousel(); }

      /* Pausa en hover / touch */
      container.addEventListener('mouseenter', stopCarousel);
      container.addEventListener('mouseleave', () => { if (!intervalId) startCarousel(); });
      container.addEventListener('touchstart', stopCarousel, { passive: true });
      container.addEventListener('touchend', () => {
        setTimeout(() => { if (!intervalId) startCarousel(); }, 300);
      });

      window.addEventListener('resize', updateShadowSize);

      /* Estado inicial */
      items[0].classList.add('active');
      indicators[0].classList.add('active');
      updateShadowSize();
      startCarousel();
    })();
  </script>
</body>
</html>
