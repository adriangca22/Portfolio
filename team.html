<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary: #050a10;
      --secondary: #0d1f33;
      --accent: #123FAE;
      --accent-light: #3D7DFF;
      --accent-glow: rgba(18, 63, 174, 0.4);
      --text: #e0e6ed;
      --text-muted: #8b95a5;
      --white: #ffffff;
      --gradient: linear-gradient(135deg, #050a10 0%, #0d1f33 50%, #071424 100%);
      --accent-gradient: linear-gradient(135deg, #123FAE, #081F5C);
    }
    html, body { 
      width:100%; 
      height:100%;
      background: #0a0e17;
      color:var(--text);
      font-family:'Sora',system-ui,sans-serif; 
      padding: 0.8rem;
      margin:0;
      overflow-x: clip; /* ✅ seguro anti scroll horizontal */
    }
    body {
      display: flex;
      flex-direction: column;
    }

    .team-section {
      width:100%; 
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2.5rem 1.8rem;
      background: 
        radial-gradient(circle at 20% 35%, rgba(18, 63, 174, 0.12) 1.5px, transparent 1.5px),
        radial-gradient(circle at 70% 85%, rgba(61, 125, 255, 0.1) 1.5px, transparent 1.5px),
        repeating-linear-gradient(45deg, 
          rgba(18, 63, 174, 0.05) 0px, 
          rgba(18, 63, 174, 0.05) 2px,
          transparent 2px,
          transparent 12px),
        repeating-linear-gradient(135deg, 
          rgba(61, 125, 255, 0.04) 0px, 
          rgba(61, 125, 255, 0.04) 1px,
          transparent 1px,
          transparent 10px),
        linear-gradient(145deg, #071424 0%, #0c1526 35%, #120d24 100%);
      background-blend-mode: overlay, normal, normal, normal;
      border-radius:1.8rem; 
      border:1px solid rgba(18,63,174,0.45);
      box-shadow:0 25px 45px -15px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
      position:relative; 
      overflow-x: visible;
      overflow-y: visible;
      min-height: 100%;
      --mx: 50%;
      --my: 40%;
    }
    
    .team-section::before {
      content:''; 
      position:absolute; 
      inset:0;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.2"><path fill="none" stroke="%23123FAE" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 6" d="M30 30 L 170 30 M30 60 L 170 60 M30 90 L 170 90 M30 120 L 170 120 M30 150 L 170 150 M30 180 L 170 180 M60 30 L 60 170 M90 30 L 90 170 M120 30 L 120 170 M150 30 L 150 170"/><circle cx="40" cy="40" r="2" fill="%233D7DFF" opacity="0.5"/><circle cx="160" cy="160" r="2.5" fill="%233D7DFF" opacity="0.4"/><circle cx="90" cy="140" r="1.8" fill="%23123FAE" opacity="0.6"/></svg>');
      background-repeat: repeat;
      background-size: 40px 40px;
      pointer-events:none;
      mix-blend-mode: overlay;
      border-radius: inherit;
      animation: gridPulse 6s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.45; }
    }
    
    .team-section::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 30%, rgba(61, 125, 255, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 85% 70%, rgba(18, 63, 174, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      border-radius: inherit;
    }

    /* ====== CAPA DE EFECTOS DE FONDO ====== */
    .bg-fx {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: inherit;
      z-index: 1;
      pointer-events: none;
    }
    .bg-fx::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(340px circle at var(--mx) var(--my), rgba(61,125,255,0.13), transparent 65%);
      opacity: 0;
      transition: opacity .5s ease;
      z-index: 4;
    }
    .team-section:hover .bg-fx::before { opacity: 1; }

    .bg-fx::after {
      content: '';
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: 0;
      width: 40%;
      background: linear-gradient(100deg, transparent, rgba(128,165,255,0.05) 30%, rgba(255,255,255,0.06) 50%, rgba(61,125,255,0.05) 70%, transparent);
      transform: skewX(-18deg) translateX(-160%);
      animation: beamSweep 7s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes beamSweep {
      0%, 55% { transform: skewX(-18deg) translateX(-160%); }
      85%, 100% { transform: skewX(-18deg) translateX(420%); }
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.5;
      will-change: transform;
    }
    .aurora-1 {
      width: 420px; height: 420px;
      top: -140px; left: -120px;
      background: radial-gradient(circle, rgba(18,63,174,0.5), transparent 70%);
      animation: auroraDrift1 18s ease-in-out infinite alternate;
    }
    .aurora-2 {
      width: 360px; height: 360px;
      bottom: -130px; right: -90px;
      background: radial-gradient(circle, rgba(61,125,255,0.35), transparent 70%);
      animation: auroraDrift2 22s ease-in-out infinite alternate;
    }
    .aurora-3 {
      width: 300px; height: 300px;
      top: 40%; left: 55%;
      background: radial-gradient(circle, rgba(8,31,92,0.6), transparent 70%);
      animation: auroraDrift3 26s ease-in-out infinite alternate;
    }
    @keyframes auroraDrift1 {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(90px, 50px) scale(1.15); }
      100% { transform: translate(30px, 100px) scale(0.95); }
    }
    @keyframes auroraDrift2 {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(-80px, -60px) scale(1.2); }
      100% { transform: translate(-120px, 20px) scale(1); }
    }
    @keyframes auroraDrift3 {
      0%   { transform: translate(0,0) scale(1); opacity: .35; }
      100% { transform: translate(-140px, -40px) scale(1.25); opacity: .6; }
    }

    .particles { position: absolute; inset: 0; z-index: 3; }
    .particle {
      position: absolute;
      bottom: -10px;
      border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 8px rgba(61,125,255,0.9);
      animation: floatUp linear infinite;
    }
    .particle.p-white { background: #cfe0ff; box-shadow: 0 0 8px rgba(255,255,255,0.8); }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-760px) translateX(24px); opacity: 0; }
    }
    
    .team-heading, .skills-carousel {
      position: relative;
      z-index: 3;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .team-heading {
      text-align:center; 
      margin-bottom: 2.2rem; 
      gap: 0.4rem;
      overflow: visible; 
      padding: 0.5rem 0;
      animation: fadeUp .8s cubic-bezier(.2,.8,.3,1) both;
    }
    .skills-carousel { animation: fadeUp .8s .18s cubic-bezier(.2,.8,.3,1) both; }

    .team-heading h2 {
      font-family:'Outfit',sans-serif; 
      font-size:clamp(2.4rem, 8vw, 3.6rem); 
      font-weight:900;
      letter-spacing:-0.03em;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff 15%,
        #3D7DFF 28%,
        #123FAE 38%,
        #80A5FF 48%,
        #123FAE 58%,
        #3D7DFF 68%,
        #ffffff 80%,
        #ffffff 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientTravel 5s linear infinite, titleGlow 4.5s ease-in-out infinite;
      line-height: 1.35;
      padding: 0.2rem 0;
    }
    @keyframes gradientTravel {
      0%   { background-position: 100% 0; }
      100% { background-position: -50% 0; }
    }
    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(61,125,255,0.2)); }
      50% { filter: drop-shadow(0 0 26px rgba(61,125,255,0.55)); }
    }
    .team-heading .sub {
      font-size: clamp(0.8rem, 3.2vw, 1.05rem); /* ✅ fluido */
      font-weight: 500;
      gap: 0.4rem;
      margin-top: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px dashed rgba(18,63,174,.5);
      padding-bottom: 0.6rem;
      letter-spacing: 0.5px;
    }
    .team-heading .sub::before,.team-heading .sub::after { width: 20px; background: var(--accent); }

    .skills-carousel {
      background: rgba(13,31,51,0.7);
      border-radius: 1.8rem;
      padding: 2rem 0 1.8rem;
      border: 1px solid rgba(18,63,174,0.55);
      backdrop-filter: blur(2px);
      margin-top: 0;
      overflow: visible;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.2rem;
      box-shadow: 0 15px 40px -10px rgba(18, 63, 174, 0.25), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: fadeUp .8s .18s cubic-bezier(.2,.8,.3,1) both, cardGlow 4s ease-in-out infinite;
    }
    @keyframes cardGlow {
      0%, 100% { box-shadow: 0 15px 40px -10px rgba(18,63,174,0.25), inset 0 1px 0 rgba(255,255,255,0.05); }
      50% { box-shadow: 0 15px 55px -8px rgba(61,125,255,0.42), inset 0 1px 0 rgba(255,255,255,0.09); }
    }

    /* ====== ✅ TÍTULO DEL CARRUSEL (RESPONSIVE) ====== */
    .carousel-title {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;                          /* ✅ permite saltar de línea */
      gap: 0.6rem clamp(0.6rem, 3vw, 1.2rem);
      padding: 0 clamp(0.8rem, 4vw, 1.6rem);
      max-width: 100%;
      margin-bottom: 0;
    }
    .ct-line {
      flex: 1 1 20px;                           /* ✅ puede encogerse */
      min-width: 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(18,63,174,0.7), rgba(61,125,255,0.5));
    }
    .ct-line:last-child { background: linear-gradient(90deg, rgba(61,125,255,0.5), rgba(18,63,174,0.7), transparent); }
    .ct-content {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;                          /* ✅ antes: white-space: nowrap */
      gap: 0.4rem 0.9rem;
      white-space: normal;
      min-width: 0;
      max-width: 100%;
      text-align: center;
    }
    .ct-label {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.95rem, 4.5vw, 1.25rem);        /* ✅ fluido */
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: clamp(1.5px, 0.9vw, 3.5px);       /* ✅ fluido */
      background: linear-gradient(120deg, #fff 40%, var(--accent-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .ct-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 9px var(--accent-light);
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.6; } }
    .ct-sub {
      font-size: clamp(0.7rem, 2.8vw, 0.9rem);          /* ✅ fluido */
      font-weight: 500;
      letter-spacing: clamp(1px, 0.6vw, 1.8px);
      color: var(--text-muted);
      text-transform: uppercase;
    }
    
    .infinite-carousel {
      position: relative;
      overflow-x: visible;
      mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    }
    .carousel-track {
      display: flex;
      gap: 2.4rem;
      width: max-content;
      animation: scroll 32s linear infinite, trackFade 1s .35s both;
      padding: 1rem 0;
    }
    @keyframes trackFade { from { opacity: 0; } to { opacity: 1; } }
    .infinite-carousel:hover .carousel-track { animation-play-state: paused, paused; }
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    
    .skill-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      min-width: 165px;
      transition: transform 0.25s ease;
      cursor: pointer;
      position: relative;
    }
    .skill-item::before {
      content: '';
      position: absolute;
      top: 0.4rem;
      left: 50%;
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61,125,255,0.3), transparent 70%);
      transform: translateX(-50%) scale(0.5);
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .skill-item:hover::before { opacity: 1; transform: translateX(-50%) scale(1); }
    .skill-item:hover { transform: translateY(-7px); }
    .skill-logo {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 0;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }
    .skill-item:hover .skill-logo { transform: scale(1.12); }
    .skill-logo img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      transition: filter 0.3s ease;
    }
    .skill-item:hover .skill-logo img {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)) drop-shadow(0 0 16px rgba(61,125,255,0.6));
    }
    .skill-name {
      font-family: 'Sora', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-light), #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }
    .carousel-hint {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 0;
      opacity: 0.6;
      color: var(--text-muted);
      letter-spacing: 0.8px;
    }
    
    /* ====== ✅ MEDIA QUERIES ACTUALIZADAS ====== */
    @media (max-width: 680px) {
      body { padding: 0.4rem; }
      .team-section { padding: 2.2rem 1.2rem; }
      .skills-carousel { padding: 1.4rem 0 1.2rem; gap: 1.5rem; }
      .skill-item { 
        min-width: 125px; 
        padding: 0.8rem 1rem;
      }
      .skill-logo { 
        width: 68px; 
        height: 68px; 
      }
      .skill-logo img { width: 58px; height: 58px; }
      .skill-name { font-size: 0.85rem; }
      .carousel-title { padding: 0 0.9rem; gap: 0.5rem 0.7rem; }
      .ct-label { font-size: clamp(0.9rem, 5vw, 1.05rem); letter-spacing: 2px; }
      .ct-sub { font-size: 0.72rem; letter-spacing: 1.2px; }
      .team-heading h2 { font-size: clamp(1.9rem, 7vw, 2.6rem); }
      .team-heading .sub { font-size: 0.85rem; }
      .aurora { filter: blur(50px); }
      .aurora-1 { width: 280px; height: 280px; }
      .aurora-2 { width: 240px; height: 240px; }
      .aurora-3 { width: 200px; height: 200px; }
    }
    
    @media (max-width: 480px) {
      .skill-item { min-width: 105px; padding: 0.7rem 0.8rem; }
      .skill-logo { width: 56px; height: 56px; }
      .skill-logo img { width: 48px; height: 48px; }
      .skill-name { font-size: 0.75rem; }
      .team-heading h2 { font-size: 1.9rem; }
      .team-heading .sub { font-size: 0.78rem; }
      .carousel-title { padding: 0 0.5rem; }
      .ct-line { display: none; }               /* ✅ líneas fuera en móviles chicos */
      .ct-label { font-size: 0.95rem; letter-spacing: 1.5px; }
      .ct-sub { font-size: 0.68rem; letter-spacing: 1px; }
      .carousel-hint { font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div class="team-section">

  <!-- capa de efectos de fondo -->
  <div class="bg-fx">
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="aurora aurora-3"></div>
    <div class="particles" id="particles"></div>
  </div>

  <div class="team-heading">
    <h2>Framework y Lenguajes</h2>
    <div class="sub">Talento &amp; especialización · experiencias digitales</div>
  </div>

  <div class="skills-carousel">
    <div class="carousel-title">
      <div class="ct-line"></div>
      <div class="ct-content">
        <span class="ct-label">Stack Tecnológico</span>
        <span class="ct-dot"></span>
        <span class="ct-sub">Herramientas</span>
      </div>
      <div class="ct-line"></div>
    </div>
    <div class="infinite-carousel">
      <div class="carousel-track" id="track"></div>
    </div>
    <div class="carousel-hint">pasa el cursor para pausar</div>
  </div>

</div>
<script>
(function(){
  /* ===== PARTÍCULAS FLOTANTES ===== */
  const particlesBox = document.getElementById('particles');
  const PARTICLE_COUNT = 26;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = document.createElement('span');
    p.className = 'particle' + (Math.random() > 0.6 ? ' p-white' : '');
    const size = Math.random() * 3 + 1.5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 12 + 10) + 's';
    p.style.animationDelay = (Math.random() * -22) + 's';
    particlesBox.appendChild(p);
  }

  /* ===== LUZ QUE SIGUE AL MOUSE ===== */
  const section = document.querySelector('.team-section');
  section.addEventListener('mousemove', (e) => {
    const r = section.getBoundingClientRect();
    section.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    section.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });

  /* ===== CARRUSEL DE STACK ===== */
  const skillsData = [
    {name:'Photoshop',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/photoshop/photoshop-plain.svg'},
    {name:'HTML5',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg'},
    {name:'CSS3',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg'},
    {name:'JavaScript',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg'},
    {name:'Blender',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/blender/blender-original.svg'},
    {name:'React',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg'},
    {name:'Python',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg'},
    {name:'After Effects',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/aftereffects/aftereffects-original.svg'},
    {name:'Illustrator',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/illustrator/illustrator-plain.svg'},
    {name:'Node.js',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg'},
    {name:'Shopify',logo:'https://cdn.simpleicons.org/shopify/96bf48'},
    {name:'Figma',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg'},
    {name:'WordPress',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/wordpress/wordpress-plain.svg'},
    {name:'Framer',logo:'https://cdn.simpleicons.org/framer/ffffff'},
    {name:'MySQL',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg'},
    {name:'Tailwind',logo:'https://cdn.simpleicons.org/tailwindcss/38bdf8'},
    {name:'Git',logo:'https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg'}
  ];
  
  const unique = [];
  const seen = new Set();
  for (const s of skillsData) {
    if (!seen.has(s.name)) {
      seen.add(s.name);
      unique.push(s);
    }
  }
  
  const doubled = [...unique, ...unique];
  
  const fallbackIcons = {
    'Photoshop':'🎨','HTML5':'🌐','CSS3':'🎭','JavaScript':'⚡','Blender':'🧊','React':'⚛️',
    'Python':'🐍','After Effects':'🎬','Illustrator':'📐','Node.js':'🗄️','Shopify':'🛍️','Figma':'💎',
    'WordPress':'🌀','Framer':'🔷','MySQL':'🗄️','Tailwind':'🎯','Git':'🌀'
  };
  
  function buildSkillItem(skill) {
    const div = document.createElement('div');
    div.className = 'skill-item';
    const fallback = fallbackIcons[skill.name] || '🔧';
    div.innerHTML = `
      <div class="skill-logo">
        <img src="${skill.logo}" alt="${skill.name}" 
             onerror="this.onerror=null; this.outerHTML='<span style=\\'font-size:4.2rem; line-height:1; display:block\\'>${fallback}</span>'">
      </div>
      <div class="skill-name">${skill.name}</div>
    `;
    return div;
  }
  
  const track = document.getElementById('track');
  if (track) {
    track.innerHTML = '';
